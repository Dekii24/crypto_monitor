name: CI Pipeline for Crypto Tracker

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code downloading to server
        uses: actions/checkout@v4

      - name: Build
        run: docker build -t cryptomonitor:latest .
#Trigger GitHub Actions
