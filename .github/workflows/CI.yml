name: Docker Image CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push the Docker image
      run: |
        cd CryptoMonitor
        docker build . --file Dockerfile --tag ghcr.io/dekii24/cryptomonitor:latest
        docker push ghcr.io/dekii24/cryptomonitor:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - name: Log in to the server and update
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo docker pull ghcr.io/dekii24/cryptomonitor:latest
          sudo docker stop my-crypto-app || true
          sudo docker rm my-crypto-app || true
          sudo docker run -d -p 80:8080 --name my-crypto-app ghcr.io/dekii24/cryptomonitor:latest
